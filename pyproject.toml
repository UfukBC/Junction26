[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-rl"
version = "0.1.0"
description = "Chess reinforcement-learning environment for LLMs, scored against Stockfish"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.10",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
