<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safe this week</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --green: #017842;
        --green-text: #0a7442;
        --green-bright: #00ac49;
        --tint: #ebf7ed;
        --text: #1c1c1e;
        --text-muted: #6b6b70;
        --line: #e4e4e6;
        --bg: #ffffff;
        --frame: #dfe6e1;
        font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { background: var(--frame); display: grid; place-items: center; }

      .phone {
        width: 430px;
        height: min(932px, 96dvh);
        background: var(--bg);
        border-radius: 36px;
        box-shadow: 0 24px 60px rgba(0, 40, 20, 0.18);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .playhead { height: 3px; background: var(--line); flex: none; }
      .playhead > span { display: block; height: 100%; width: 0; background: var(--green-bright); }

      .screen {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 28px 22px 26px;
      }
      .eyebrow {
        margin: 0;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--green-bright);
      }
      .value {
        margin: 8px 0 0;
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -1.4px;
        line-height: 1;
        color: var(--green-text);
        font-variant-numeric: tabular-nums;
      }
      .reason {
        margin: 12px 0 0;
        max-width: 26em;
        font-size: 16px;
        line-height: 1.35;
        color: var(--text-muted);
      }

      .card {
        margin-top: 22px;
        padding: 14px 16px 14px;
        border-radius: 16px;
        background: #f4f5f6;
      }
      .card__top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      .card__name { margin: 0; font-size: 17px; font-weight: 800; }
      .card__amt {
        margin: 0;
        font-size: 17px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: var(--green-text);
      }
      .card__meta { margin: 2px 0 0; font-size: 13px; color: var(--text-muted); }
      .ask { margin: 14px 0 0; font-size: 16px; line-height: 1.35; font-weight: 700; }
      .ask.is-said { font-weight: 600; }
      .reply { margin: 4px 0 0; font-size: 16px; line-height: 1.35; font-weight: 800; color: var(--green-text); }

      .tabbar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background: var(--bg);
        border-top: 1px solid var(--line);
        padding: 10px 0 16px;
        flex: none;
      }
      .tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 12.5px;
        color: var(--text-muted);
        background: none;
        border: 0;
        font: inherit;
      }
      .tab--active { color: var(--text); }
    </style>
  </head>
  <body>
    <div class="phone" id="phone">
      <div class="playhead" aria-hidden="true"><span id="playhead"></span></div>
      <main class="screen" id="stage">
        <p class="eyebrow">Safe this week</p>
        <p class="value" id="value">554,00&nbsp;€</p>
        <p class="reason" id="reason"></p>
        <section class="card" id="card" hidden>
          <div class="card__top">
            <p class="card__name">Restaurants</p>
            <p class="card__amt" id="rest"></p>
          </div>
          <p class="card__meta">10 visits</p>
          <p class="ask" id="ask">Count these as a bill?</p>
          <p class="reply" id="reply" hidden></p>
        </section>
      </main>
      <nav class="tabbar" aria-label="Main">
        <button class="tab tab--active" type="button" aria-current="page">
          <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3.2 3 12.4V25h8.2v-7.2h5.6V25H25V12.4z" fill="none" stroke="#00ac49" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span>Home</span>
        </button>
        <button class="tab" type="button">
          <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><text x="13" y="21" text-anchor="middle" font-size="24" font-style="italic" font-weight="600" fill="none" stroke="#8e8e93" stroke-width="1.3">S</text></svg>
          <span>S-Etukortti</span>
        </button>
        <button class="tab" type="button">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H19a2 2 0 0 1 2 2v1H3v-.5zM3 10h18v6.5A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5V10z" stroke="#8e8e93" stroke-width="1.6"/><path d="M16 14.5h3" stroke="#8e8e93" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Bank</span>
        </button>
        <button class="tab" type="button">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.2" stroke="#8e8e93" stroke-width="1.6"/><path d="M5.5 19.2c1.2-2.8 3.5-4.2 6.5-4.2s5.3 1.4 6.5 4.2" stroke="#8e8e93" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Me</span>
        </button>
      </nav>
    </div>
    <script>
      const income = 359946;
      const bills = 138345;
      const restaurants = 41735;
      const same = Math.round((income - bills) / 4);
      const asBill = Math.round((income - bills - restaurants) / 4);

      const eur = (cents) => {
        const [whole, frac] = (Math.abs(cents) / 100).toFixed(2).split(".");
        const grouped = whole.replace(/\B(?=(\d{3})+(?!\d))/g, "\u00a0");
        return grouped + "," + frac + "\u00a0€";
      };

      const because = "From " + eur(income) + ", after " + eur(bills) + " of bills.";
      const passes = [
        { say: "I can skip those.", reply: "Not a bill.", because: "Still the bills only." },
        { say: "They're lunches at work.", reply: "Counted as a bill.", because: "Bills now include lunch.", to: asBill },
      ];

      const PASS = 10000;
      const valueEl = document.getElementById("value");
      const reasonEl = document.getElementById("reason");
      const cardEl = document.getElementById("card");
      const askEl = document.getElementById("ask");
      const replyEl = document.getElementById("reply");
      const stage = document.getElementById("stage");
      const playhead = document.getElementById("playhead");
      document.getElementById("rest").textContent = eur(restaurants);

      const ease = (p) => 1 - Math.pow(1 - Math.min(1, Math.max(0, p)), 3);
      const params = new URLSearchParams(location.search);
      const freezeAt = params.has("at") ? Number(params.get("at")) : null;
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let started = performance.now();
      let paused = false;
      let pausedAt = 0;

      const clock = () => {
        if (freezeAt != null && !Number.isNaN(freezeAt)) return Math.min(PASS * 2, Math.max(0, freezeAt));
        if (reduced) return 18000;
        if (paused) return pausedAt;
        return (performance.now() - started) % (PASS * 2);
      };

      const render = () => {
        const t = clock();
        const index = Math.floor(t / PASS);
        const local = t % PASS;
        const pass = passes[index];
        const showCard = local >= 2800;
        const answered = local >= 6400;
        let amount = same;
        if (pass.to != null && answered) {
          amount = Math.round(same + (pass.to - same) * ease((local - 6400) / 700));
        }

        valueEl.textContent = eur(amount);
        reasonEl.textContent = answered ? pass.because : because;
        cardEl.hidden = !showCard;
        askEl.textContent = answered ? "\u201C" + pass.say + "\u201D" : "Count these as a bill?";
        askEl.classList.toggle("is-said", answered);
        replyEl.hidden = !answered;
        replyEl.textContent = pass.reply;

        let fade = 1;
        if (local > 9600) fade = 1 - (local - 9600) / 400;
        if (local < 280) fade = local / 280;
        stage.style.opacity = String(fade);
        playhead.style.width = (t / (PASS * 2)) * 100 + "%";
        document.documentElement.dataset.ready = "1";
      };

      document.getElementById("phone").addEventListener("click", () => {
        if (freezeAt != null || reduced) return;
        if (paused) {
          started = performance.now() - pausedAt;
          paused = false;
        } else {
          pausedAt = clock();
          paused = true;
        }
      });

      const loop = () => {
        render();
        if (freezeAt == null && !reduced) requestAnimationFrame(loop);
      };
      render();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
